<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PrepQuest — Animated Chart v2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #e2e8f0;
    font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #111;
    border: 0.5px solid #222;
    border-radius: 10px;
    padding: 18px 20px;
    width: 100%;
    max-width: 620px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 8px;
  }

  .label {
    font-size: 10px;
    font-weight: 500;
    color: #555;
    text-transform: uppercase;
    letter-spacing: .1em;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .toggle-btn {
    font-family: inherit;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 4px;
    border: 0.5px solid #2a2a2a;
    background: #1a1a1a;
    color: #666;
    cursor: pointer;
    transition: all .15s;
  }

  .toggle-btn:hover { border-color: #333; color: #888; }

  .toggle-btn.active {
    border-color: #444;
    background: #252525;
    color: #e2e8f0;
  }

  .divider {
    width: 1px;
    height: 14px;
    background: #222;
    margin: 0 2px;
  }

  .custom-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
    border: 0.5px solid #2a2a2a;
    border-radius: 4px;
    background: #1a1a1a;
    padding: 2px 6px 2px 8px;
    transition: border-color .15s;
  }

  .custom-wrap:focus-within {
    border-color: #3b82f6;
  }

  .custom-wrap.active {
    border-color: #444;
    background: #252525;
  }

  .custom-input {
    font-family: inherit;
    font-size: 10px;
    background: none;
    border: none;
    color: #e2e8f0;
    width: 28px;
    outline: none;
    text-align: center;
  }

  .custom-input::placeholder { color: #444; }

  .custom-suffix {
    font-size: 9px;
    color: #555;
  }

  .custom-go {
    font-family: inherit;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    border: 0.5px solid #333;
    background: #2a2a2a;
    color: #888;
    cursor: pointer;
    transition: all .15s;
    margin-left: 2px;
  }

  .custom-go:hover { color: #e2e8f0; border-color: #444; }

  /* Chart */
  .chart-wrap {
    position: relative;
    height: 140px;
    margin-bottom: 8px;
  }

  svg.chart { width: 100%; height: 100%; overflow: visible; }

  .chart-line {
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
    animation: drawLine .9s cubic-bezier(.4,0,.2,1) forwards;
  }

  @keyframes drawLine { to { stroke-dashoffset: 0; } }

  .chart-area {
    opacity: 0;
    animation: fadeArea .6s ease forwards .7s;
  }

  @keyframes fadeArea { to { opacity: 1; } }

  .chart-dot {
    transform-origin: center;
    transform-box: fill-box;
    opacity: 0;
    transform: scale(0);
  }

  .chart-dot.popped {
    animation: popDot .3s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes popDot { to { opacity: 1; transform: scale(1); } }

  .dot-pulse {
    transform-origin: center;
    transform-box: fill-box;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { r: 5; opacity: 1; }
    50%       { r: 7; opacity: .65; }
  }

  .crosshair {
    stroke: #2a2a2a;
    stroke-width: 1;
    stroke-dasharray: 3 3;
    opacity: 0;
    transition: opacity .1s;
    pointer-events: none;
  }

  .tooltip {
    position: absolute;
    background: #1e1e1e;
    border: 0.5px solid #333;
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 11px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    white-space: nowrap;
    z-index: 10;
  }

  .tooltip.visible { opacity: 1; }
  .tooltip .xp { color: #3b82f6; font-weight: 600; }
  .tooltip .day { color: #666; font-size: 9px; margin-top: 1px; }

  .axis-label { font-size: 8px; fill: #333; font-family: monospace; }

  .day-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }

  .day-label { font-size: 9px; color: #444; text-align: center; flex: 1; }
  .day-label.today { color: #f59e0b; }

  .summary {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 0.5px solid #1a1a1a;
  }

  .summary-item { text-align: center; flex: 1; }
  .summary-val { font-size: 16px; font-weight: 500; color: #e2e8f0; }
  .summary-lbl { font-size: 9px; color: #444; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }

  .note {
    text-align: center;
    margin-top: 28px;
    font-size: 11px;
    color: #444;
  }
  .note em { color: #3b82f6; font-style: normal; }
</style>
</head>
<body>

<div style="width:100%;max-width:640px;">
  <div class="card">
    <div class="card-header">
      <span class="label">XP earned per day</span>
      <div class="controls">
        <button class="toggle-btn active" id="btn7"  onclick="setPreset(7)">7d</button>
        <button class="toggle-btn"        id="btn30" onclick="setPreset(30)">30d</button>
        <div class="divider"></div>
        <div class="custom-wrap" id="customWrap">
          <input
            class="custom-input"
            id="customInput"
            type="number"
            min="1"
            max="365"
            placeholder="—"
            title="Enter number of days"
            onkeydown="handleCustomKey(event)"
            oninput="onCustomInput()"
            onchange="applyCustom()"
          />
          <span class="custom-suffix">d</span>
          <button class="custom-go" onclick="applyCustom()" title="Apply">↵</button>
        </div>
      </div>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <div class="tooltip" id="tooltip">
        <div class="xp" id="ttXP"></div>
        <div class="day" id="ttDay"></div>
      </div>
    </div>

    <div class="day-labels" id="dayLabels"></div>
    <div class="summary"    id="summary"></div>
  </div>

  <p class="note">
    Hover dots for XP · <em>7d / 30d</em> presets · type any number + <em>↵</em> for custom range
  </p>
</div>

<script>
const ALL_DATA = (() => {
  const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const xps = [
    35,70,0,120,0,85,135,
    50,0,90,40,110,70,0,
    80,35,0,150,60,0,95,
    40,70,0,85,120,50,0,
    110,175
  ];
  return Array.from({ length: 90 }, (_, i) => ({
    label: labels[i % 7],
    xp: i < xps.length ? xps[i] : (Math.random() < .3 ? 0 : Math.round(Math.random() * 140 + 15)),
  }));
})();

let currentView = 7;
let customActive = false;

function setPreset(n) {
  currentView = n;
  customActive = false;
  document.getElementById('btn7').classList.toggle('active', n === 7);
  document.getElementById('btn30').classList.toggle('active', n === 30);
  document.getElementById('customWrap').classList.remove('active');
  document.getElementById('customInput').value = '';
  renderChart(n);
}

function onCustomInput() {
  document.getElementById('btn7').classList.remove('active');
  document.getElementById('btn30').classList.remove('active');
  document.getElementById('customWrap').classList.add('active');
}

function handleCustomKey(e) {
  if (e.key === 'Enter') applyCustom();
}

function applyCustom() {
  const val = parseInt(document.getElementById('customInput').value, 10);
  if (!val || val < 1) return;
  const clamped = Math.min(val, ALL_DATA.length);
  currentView = clamped;
  customActive = true;
  document.getElementById('btn7').classList.remove('active');
  document.getElementById('btn30').classList.remove('active');
  document.getElementById('customWrap').classList.add('active');
  renderChart(clamped);
}

function renderChart(n) {
  const wrap = document.getElementById('chartWrap');
  // Remove ALL existing SVGs immediately to avoid stacking on rapid calls
  wrap.querySelectorAll('svg').forEach(s => s.remove());
  buildChart(ALL_DATA.slice(-n), wrap, n);
}

function buildChart(data, wrap, n) {
  const W = wrap.clientWidth || 560;
  const H = 130;
  const pad = { top: 14, right: 8, bottom: 18, left: 30 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;
  const maxXP = Math.max(...data.map(d => d.xp), 40);
  const step = iW / Math.max(data.length - 1, 1);

  const pts = data.map((d, i) => ({
    x: pad.left + i * step,
    y: pad.top + iH - (d.xp / maxXP) * iH,
    xp: d.xp,
    label: d.label,
    isToday: i === data.length - 1,
    isEmpty: d.xp === 0,
    idx: i,
  }));

  const svg = mkSVG('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' });
  svg.classList.add('chart');

  // Gradient
  const defs = mkSVG('defs');
  const grad = mkSVG('linearGradient', { id:'ag', x1:'0', y1:'0', x2:'0', y2:'1' });
  grad.appendChild(mkSVG('stop', { offset:'0%',   'stop-color':'#3b82f6','stop-opacity':'0.3' }));
  grad.appendChild(mkSVG('stop', { offset:'100%', 'stop-color':'#3b82f6','stop-opacity':'0.02' }));
  defs.appendChild(grad);
  svg.appendChild(defs);

  // Gridlines
  [0, .5, 1].forEach(f => {
    const y = pad.top + iH - f * iH;
    svg.appendChild(mkSVG('line', { x1:pad.left, y1:y, x2:pad.left+iW, y2:y, stroke:'#1a1a1a', 'stroke-width':'1' }));
    const t = mkSVG('text', { x:pad.left-4, y:y+3, 'text-anchor':'end' });
    t.classList.add('axis-label');
    t.textContent = Math.round(f * maxXP);
    svg.appendChild(t);
  });

  // Crosshair
  const ch = mkSVG('line', { x1:0, y1:pad.top, x2:0, y2:pad.top+iH });
  ch.classList.add('crosshair');
  ch.id = 'crosshair';
  svg.appendChild(ch);

  if (pts.length > 1) {
    // Area
    const areaD = `M ${pts[0].x},${pts[0].y} ` + pts.map(p=>`L${p.x},${p.y}`).join(' ')
      + ` L${pts[pts.length-1].x},${pad.top+iH} L${pts[0].x},${pad.top+iH} Z`;
    const area = mkSVG('path', { d: areaD, fill:'url(#ag)' });
    area.classList.add('chart-area');
    svg.appendChild(area);

    // Smooth line
    const lineD = smoothPath(pts);
    const line = mkSVG('path', { d:lineD, fill:'none', stroke:'#3b82f6', 'stroke-width':'1.8',
      'stroke-linejoin':'round', 'stroke-linecap':'round' });
    line.classList.add('chart-line');
    svg.appendChild(line);
  }

  // Dots — skip individual dots when n > 30 (too dense), only show today
  const showDots = n <= 30;
  pts.forEach((p, i) => {
    if (p.isToday) {
      const ring = mkSVG('circle', { cx:p.x, cy:p.y, r:'8', fill:'none', stroke:'#f59e0b', 'stroke-opacity':'.2' });
      ring.classList.add('dot-pulse');
      svg.appendChild(ring);
      const dot = mkSVG('circle', { cx:p.x, cy:p.y, r:'5', fill:'#f59e0b' });
      dot.classList.add('dot-pulse');
      svg.appendChild(dot);
    } else if (showDots) {
      const dot = mkSVG('circle', {
        cx:p.x, cy:p.y,
        r: p.isEmpty ? '2.5' : '3.5',
        fill: p.isEmpty ? '#111' : '#1e293b',
        stroke: p.isEmpty ? '#2a2a2a' : '#3b82f6',
        'stroke-width':'1.5',
      });
      dot.classList.add('chart-dot');
      svg.appendChild(dot);
      setTimeout(() => dot.classList.add('popped'), 700 + i * Math.min(30, 600/pts.length));
    }
  });

  // Hover zones
  pts.forEach(p => {
    const zW = Math.max(step, 20);
    const zone = mkSVG('rect', { x:p.x-zW/2, y:pad.top, width:zW, height:iH, fill:'transparent' });
    zone.addEventListener('mouseenter', () => showTT(p, wrap, W));
    zone.addEventListener('mouseleave', hideTT);
    svg.appendChild(zone);
  });

  wrap.appendChild(svg);
  renderDayLabels(data, n);
  renderSummary(data);
}

function smoothPath(pts) {
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i-1], c = pts[i];
    const mx = (p.x + c.x) / 2;
    d += ` C ${mx} ${p.y}, ${mx} ${c.y}, ${c.x} ${c.y}`;
  }
  return d;
}

function showTT(p, wrap, W) {
  const tt = document.getElementById('tooltip');
  const ch = document.getElementById('crosshair');
  document.getElementById('ttXP').textContent = p.isEmpty ? '0 XP — rest day' : `+${p.xp} XP`;
  document.getElementById('ttDay').textContent = p.isToday ? `${p.label} (today)` : p.label;
  tt.classList.add('visible');
  const left = Math.min(Math.max(p.x - 40, 0), W - 110);
  tt.style.left = left + 'px';
  tt.style.top  = '2px';
  if (ch) { ch.setAttribute('x1', p.x); ch.setAttribute('x2', p.x); ch.style.opacity = '1'; }
}

function hideTT() {
  document.getElementById('tooltip').classList.remove('visible');
  const ch = document.getElementById('crosshair');
  if (ch) ch.style.opacity = '0';
}

function renderDayLabels(data, n) {
  const c = document.getElementById('dayLabels');
  c.innerHTML = '';
  const step = n <= 7 ? 1 : n <= 14 ? 2 : n <= 30 ? 7 : Math.ceil(n / 6);
  data.forEach((d, i) => {
    const span = document.createElement('span');
    span.className = 'day-label' + (i === data.length-1 ? ' today' : '');
    const isLast = i === data.length - 1;
    const show = i % step === 0 || isLast;
    span.textContent = show ? (isLast ? 'Today' : d.label) : '';
    c.appendChild(span);
  });
}

function renderSummary(data) {
  const total  = data.reduce((s,d) => s+d.xp, 0);
  const active = data.filter(d => d.xp > 0).length;
  const best   = Math.max(...data.map(d => d.xp));
  const avg    = active ? Math.round(total/active) : 0;
  document.getElementById('summary').innerHTML = `
    <div class="summary-item"><div class="summary-val">${total}</div><div class="summary-lbl">total XP</div></div>
    <div class="summary-item"><div class="summary-val">${active}</div><div class="summary-lbl">active days</div></div>
    <div class="summary-item"><div class="summary-val">${best}</div><div class="summary-lbl">best day</div></div>
    <div class="summary-item"><div class="summary-val">${avg}</div><div class="summary-lbl">avg / active day</div></div>
  `;
}

function mkSVG(tag, attrs={}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
  return el;
}

renderChart(7);
</script>
</body>
</html>
